<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Aquilo Heat Pipe Adjacency Rule - Factorio Guide</title>
  <text x="320" y="26" fill="#8fd4f0" font-size="16" text-anchor="middle" font-weight="bold">The One Rule: Adjacent Means Touching, Orthogonally Or Diagonally</text>

  <text x="130" y="58" fill="#6abe30" font-size="12" text-anchor="middle" font-weight="bold">WORKS - touching the heat pipe</text>
  <g transform="translate(40,70)">
    <rect x="0" y="0" width="36" height="36" fill="#1d3a4d" stroke="#3a6a80" stroke-width="1"/>
    <rect x="36" y="0" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="72" y="0" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="108" y="0" width="36" height="36" fill="#1d3a4d" stroke="#3a6a80" stroke-width="1"/>

    <rect x="0" y="36" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="36" y="36" width="36" height="36" fill="#3d2412" stroke="#e8941c" stroke-width="2"/>
    <rect x="72" y="36" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="108" y="36" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>

    <rect x="0" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="36" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="72" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="108" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>

    <text x="54" y="58" fill="#e8941c" font-size="11" text-anchor="middle">HEAT</text>
    <text x="18" y="58" fill="#6abe30" font-size="10" text-anchor="middle">ok</text>
    <text x="90" y="58" fill="#6abe30" font-size="10" text-anchor="middle">ok</text>
    <text x="126" y="58" fill="#6abe30" font-size="10" text-anchor="middle">ok</text>
    <text x="54" y="22" fill="#6abe30" font-size="10" text-anchor="middle">ok</text>
  </g>

  <text x="470" y="58" fill="#c9463d" font-size="12" text-anchor="middle" font-weight="bold">FAILS - one tile of gap</text>
  <g transform="translate(380,70)">
    <rect x="0" y="0" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="36" y="0" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="72" y="0" width="36" height="36" fill="#1d1d1d" stroke="#c9463d" stroke-width="2"/>
    <rect x="108" y="0" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>

    <rect x="0" y="36" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="36" y="36" width="36" height="36" fill="#3d2412" stroke="#e8941c" stroke-width="2"/>
    <rect x="72" y="36" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="108" y="36" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>

    <rect x="0" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="36" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="72" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="108" y="72" width="36" height="36" fill="#2a2a2a" stroke="#555" stroke-width="1"/>

    <text x="54" y="58" fill="#e8941c" font-size="11" text-anchor="middle">HEAT</text>
    <text x="90" y="22" fill="#c9463d" font-size="10" text-anchor="middle">frozen</text>
    <text x="90" y="130" fill="#999" font-size="10" text-anchor="middle">machine must touch the network</text>
  </g>

  <rect x="40" y="200" width="560" height="60" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="58" y="222" fill="#8fd4f0" font-size="11" font-weight="bold">Heat pipes never lose heat to the environment.</text>
  <text x="58" y="240" fill="#999" font-size="10">They only lose it to entities that need warmth. If your temperature drops, it is demand, not distance.</text>
  <text x="58" y="254" fill="#999" font-size="10">Threshold to keep a building alive: the source must sit above 30 degrees C.</text>

  <rect x="40" y="272" width="560" height="52" rx="4" fill="#231a10" stroke="#e8941c" stroke-width="1"/>
  <text x="58" y="292" fill="#e8941c" font-size="11" font-weight="bold">Fast check: hover the building and look for the freezing icon.</text>
  <text x="58" y="310" fill="#999" font-size="10">If it is there, either it does not touch a heated tile, or demand has dragged the network below 30 degrees C.</text>
</svg>
