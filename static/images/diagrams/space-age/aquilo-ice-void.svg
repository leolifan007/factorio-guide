<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Aquilo Excess Ice - Void and Reuse Setup - Factorio Guide</title>
  <text x="320" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Aquilo Ice Surplus: 3-Way Sink</text>

  <rect x="30" y="60" width="120" height="56" rx="4" fill="#252525" stroke="#4a90d9" stroke-width="2"/>
  <text x="90" y="84" fill="#ccc" font-size="12" text-anchor="middle">Lithium Brine</text>
  <text x="90" y="100" fill="#4a90d9" font-size="10" text-anchor="middle">Separator</text>

  <line x1="150" y1="88" x2="196" y2="88" stroke="#888" stroke-width="2"/>
  <text x="173" y="80" fill="#8fd4f0" font-size="9" text-anchor="middle">+ ice</text>

  <rect x="200" y="60" width="110" height="56" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="255" y="84" fill="#ccc" font-size="12" text-anchor="middle">Ice Buffer</text>
  <text x="255" y="100" fill="#8fd4f0" font-size="10" text-anchor="middle">(chest/tank)</text>

  <line x1="255" y1="116" x2="255" y2="140" stroke="#888" stroke-width="2"/>
  <text x="300" y="133" fill="#888" font-size="9" text-anchor="middle">circuit: split by count</text>

  <rect x="120" y="150" width="100" height="58" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="170" y="174" fill="#6abe30" font-size="11" text-anchor="middle">Water</text>
  <text x="170" y="190" fill="#ccc" font-size="10" text-anchor="middle">Chem Plant</text>
  <text x="170" y="203" fill="#6abe30" font-size="9" text-anchor="middle">&lt; 2000</text>

  <rect x="240" y="150" width="100" height="58" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="290" y="174" fill="#d7b940" font-size="11" text-anchor="middle">Heating</text>
  <text x="290" y="190" fill="#ccc" font-size="10" text-anchor="middle">Tower</text>
  <text x="290" y="203" fill="#d7b940" font-size="9" text-anchor="middle">steam</text>

  <rect x="360" y="150" width="100" height="58" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="410" y="174" fill="#c9463d" font-size="11" text-anchor="middle">Recycler</text>
  <text x="410" y="190" fill="#ccc" font-size="10" text-anchor="middle">VOID</text>
  <text x="410" y="203" fill="#c9463d" font-size="9" text-anchor="middle">&gt; 2000</text>

  <path d="M170,116 L170,148" stroke="#6abe30" stroke-width="1.5" fill="none"/>
  <path d="M290,116 L290,148" stroke="#d7b940" stroke-width="1.5" fill="none"/>
  <path d="M410,116 L410,148" stroke="#c9463d" stroke-width="1.5" fill="none"/>

  <text x="320" y="245" fill="#e8941c" font-size="11" text-anchor="middle" font-weight="bold">Priority order: Water first, then Heat, void the rest</text>

  <rect x="60" y="265" width="520" height="52" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="80" y="285" fill="#888" font-size="10">1 recycler clears ~2 full brine separators</text>
  <text x="80" y="302" fill="#888" font-size="10">Never add productivity modules to the ice recycler - you want it destroyed</text>

  <rect x="60" y="265" width="6" height="52" rx="3" fill="#c9463d"/>
</svg>
