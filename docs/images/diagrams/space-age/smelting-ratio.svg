<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Smelting Ratio Chart - Furnaces Per Belt - Factorio Guide</title>
  <text x="330" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Smelting Ratio: Furnaces Per Belt</text>

  <rect x="50" y="55" width="150" height="60" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="125" y="80" fill="#8fd4f0" font-size="12" text-anchor="middle">Basic Belt</text>
  <text x="125" y="100" fill="#ccc" font-size="11" text-anchor="middle">7.5 items/sec</text>

  <rect x="255" y="55" width="150" height="60" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="330" y="80" fill="#d7b940" font-size="12" text-anchor="middle">Fast Belt</text>
  <text x="330" y="100" fill="#ccc" font-size="11" text-anchor="middle">15 items/sec</text>

  <rect x="460" y="55" width="150" height="60" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="535" y="80" fill="#c9463d" font-size="12" text-anchor="middle">Express Belt</text>
  <text x="535" y="100" fill="#ccc" font-size="11" text-anchor="middle">22.5 items/sec</text>

  <text x="330" y="150" fill="#e8941c" font-size="12" text-anchor="middle" font-weight="bold">Furnaces needed to consume a FULL belt (iron / copper)</text>

  <rect x="50" y="165" width="560" height="110" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="80" y="188" fill="#888" font-size="11">Furnace type</text>
  <text x="270" y="188" fill="#888" font-size="11">Basic 7.5/s</text>
  <text x="400" y="188" fill="#888" font-size="11">Fast 15/s</text>
  <text x="510" y="188" fill="#888" font-size="11">Express 22.5/s</text>
  <line x1="65" y1="197" x2="595" y2="197" stroke="#333" stroke-width="1"/>

  <text x="80" y="220" fill="#ccc" font-size="12">Stone furnace</text>
  <text x="278" y="220" fill="#d7b940" font-size="12">24</text>
  <text x="408" y="220" fill="#d7b940" font-size="12">48</text>
  <text x="522" y="220" fill="#d7b940" font-size="12">72</text>

  <text x="80" y="244" fill="#ccc" font-size="12">Electric furnace</text>
  <text x="278" y="244" fill="#6abe30" font-size="12">12</text>
  <text x="408" y="244" fill="#6abe30" font-size="12">24</text>
  <text x="522" y="244" fill="#6abe30" font-size="12">36</text>

  <text x="80" y="268" fill="#ccc" font-size="12">8-beacon electric</text>
  <text x="278" y="268" fill="#8fd4f0" font-size="12">~5</text>
  <text x="408" y="268" fill="#8fd4f0" font-size="12">~10</text>
  <text x="522" y="268" fill="#8fd4f0" font-size="12">~15</text>

  <text x="330" y="300" fill="#c9463d" font-size="11" text-anchor="middle" font-weight="bold">Steel needs ~5x the furnace time: give it a dedicated column</text>
  <text x="330" y="322" fill="#888" font-size="10" text-anchor="middle">Electric furnace = exactly 2x stone furnace speed</text>
</svg>
