<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Defense Upgrade Path - Factorio Guide</title>
  <text x="330" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Defense Upgrade Path</text>

  <rect x="180" y="48" width="300" height="44" rx="4" fill="#252525" stroke="#a06a3a" stroke-width="2"/>
  <text x="330" y="68" fill="#a06a3a" font-size="12" text-anchor="middle">Stone Wall</text>
  <text x="330" y="84" fill="#888" font-size="10" text-anchor="middle">+ Gun Turrets (firearm magazines)</text>

  <line x1="330" y1="92" x2="330" y2="110" stroke="#666" stroke-width="2"/>
  <polygon points="325,110 330,120 335,110" fill="#666"/>

  <rect x="180" y="122" width="300" height="44" rx="4" fill="#252525" stroke="#b08a4a" stroke-width="2"/>
  <text x="330" y="142" fill="#b08a4a" font-size="12" text-anchor="middle">Stone / Steel Wall</text>
  <text x="330" y="158" fill="#6abe30" font-size="10" text-anchor="middle">+ Gun Turrets (PIERCING ROUNDS) - biggest cheap gain</text>

  <line x1="330" y1="166" x2="330" y2="184" stroke="#666" stroke-width="2"/>
  <polygon points="325,184 330,194 335,184" fill="#666"/>

  <rect x="180" y="196" width="300" height="44" rx="4" fill="#252525" stroke="#4a90d9" stroke-width="2"/>
  <text x="330" y="216" fill="#4a90d9" font-size="12" text-anchor="middle">Steel Wall</text>
  <text x="330" y="232" fill="#ccc" font-size="10" text-anchor="middle">+ Laser Turrets (needs stable power)</text>

  <line x1="330" y1="240" x2="330" y2="258" stroke="#666" stroke-width="2"/>
  <polygon points="325,258 330,268 335,258" fill="#666"/>

  <rect x="150" y="270" width="360" height="44" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="330" y="290" fill="#c9463d" font-size="12" text-anchor="middle">Flame Turrets + Artillery</text>
  <text x="330" y="306" fill="#ccc" font-size="10" text-anchor="middle">area damage + clearing nests before they attack</text>

  <text x="120" y="70" fill="#888" font-size="10" text-anchor="end">First hours</text>
  <text x="120" y="144" fill="#888" font-size="10" text-anchor="end">Early base</text>
  <text x="120" y="218" fill="#888" font-size="10" text-anchor="end">Mid game</text>
  <text x="120" y="292" fill="#888" font-size="10" text-anchor="end">Late</text>
</svg>
