<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Gleba First Hour - From Landing To First Agricultural Science - Factorio Guide</title>
  <text x="320" y="26" fill="#6abe30" font-size="16" text-anchor="middle" font-weight="bold">First 60 Minutes On Gleba - Build Order</text>

  <rect x="20" y="52" width="128" height="64" rx="4" fill="#252525" stroke="#e8941c" stroke-width="2"/>
  <text x="84" y="76" fill="#ccc" font-size="11" text-anchor="middle">1. Power</text>
  <text x="84" y="93" fill="#e8941c" font-size="10" text-anchor="middle">heating tower +</text>
  <text x="84" y="106" fill="#e8941c" font-size="10" text-anchor="middle">steam pair</text>

  <rect x="168" y="52" width="128" height="64" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="232" y="76" fill="#ccc" font-size="11" text-anchor="middle">2. Farms</text>
  <text x="232" y="93" fill="#6abe30" font-size="10" text-anchor="middle">agri tower on</text>
  <text x="232" y="106" fill="#6abe30" font-size="10" text-anchor="middle">fertile soil</text>

  <rect x="316" y="52" width="128" height="64" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="380" y="76" fill="#ccc" font-size="11" text-anchor="middle">3. Nutrients</text>
  <text x="380" y="93" fill="#d7b940" font-size="10" text-anchor="middle">fruit - mash -</text>
  <text x="380" y="106" fill="#d7b940" font-size="10" text-anchor="middle">nutrients</text>

  <rect x="464" y="52" width="156" height="64" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="542" y="76" fill="#ccc" font-size="11" text-anchor="middle">4. Bacteria</text>
  <text x="542" y="93" fill="#8fd4f0" font-size="10" text-anchor="middle">iron + copper</text>
  <text x="542" y="106" fill="#8fd4f0" font-size="10" text-anchor="middle">cultivation in biochamber</text>

  <line x1="148" y1="84" x2="166" y2="84" stroke="#888" stroke-width="2"/>
  <line x1="296" y1="84" x2="314" y2="84" stroke="#888" stroke-width="2"/>
  <line x1="444" y1="84" x2="462" y2="84" stroke="#888" stroke-width="2"/>

  <text x="320" y="146" fill="#888" font-size="10" text-anchor="middle">everything past this point is self-sustaining - before it, you run on imported plates</text>

  <rect x="20" y="164" width="200" height="60" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="120" y="188" fill="#ccc" font-size="11" text-anchor="middle">5. Spoilage sink</text>
  <text x="120" y="205" fill="#c9463d" font-size="10" text-anchor="middle">recycler / heating tower</text>
  <text x="120" y="218" fill="#c9463d" font-size="10" text-anchor="middle">must exist before scaling</text>

  <rect x="240" y="164" width="200" height="60" rx="4" fill="#252525" stroke="#4a90d9" stroke-width="2"/>
  <text x="340" y="188" fill="#ccc" font-size="11" text-anchor="middle">6. Defense ring</text>
  <text x="340" y="205" fill="#4a90d9" font-size="10" text-anchor="middle">turrets on the landfilled</text>
  <text x="340" y="218" fill="#4a90d9" font-size="10" text-anchor="middle">side facing the marsh</text>

  <rect x="460" y="164" width="160" height="60" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="540" y="188" fill="#ccc" font-size="11" text-anchor="middle">7. Science</text>
  <text x="540" y="205" fill="#6abe30" font-size="10" text-anchor="middle">agricultural pack</text>
  <text x="540" y="218" fill="#6abe30" font-size="10" text-anchor="middle">crafted on Gleba only</text>

  <rect x="20" y="244" width="600" height="70" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <rect x="20" y="244" width="6" height="70" rx="3" fill="#c9463d"/>
  <text x="40" y="264" fill="#e8941c" font-size="11" font-weight="bold">Two killers of a Gleba start</text>
  <text x="40" y="280" fill="#999" font-size="10">Nutrients spoil in 5 minutes - never buffer them, always run the chain end to end.</text>
  <text x="40" y="296" fill="#999" font-size="10">Skipping the spoilage sink: one stalled line dumps spoilage into every downstream machine.</text>
  <text x="40" y="310" fill="#999" font-size="10">Fix both before you scale to 45 science per minute.</text>
</svg>
