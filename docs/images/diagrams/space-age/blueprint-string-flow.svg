<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Blueprint String Import Export Flow - Factorio Guide</title>
  <text x="330" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Blueprint Strings: Where They Come From</text>

  <rect x="30" y="58" width="150" height="96" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="105" y="80" fill="#6abe30" font-size="11" text-anchor="middle" font-weight="bold">Reliable Sources</text>
  <text x="46" y="102" fill="#ccc" font-size="10">Factorio Prints</text>
  <text x="46" y="120" fill="#ccc" font-size="10">A friend in-game</text>
  <text x="46" y="138" fill="#ccc" font-size="10">Your own export</text>

  <rect x="196" y="58" width="150" height="96" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="271" y="80" fill="#d7b940" font-size="11" text-anchor="middle" font-weight="bold">Check Version</text>
  <text x="212" y="102" fill="#ccc" font-size="10">Old forum posts</text>
  <text x="212" y="120" fill="#ccc" font-size="10">Pre-2.0 strings</text>
  <text x="212" y="138" fill="#888" font-size="9">may fail to import</text>

  <rect x="362" y="58" width="150" height="96" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="437" y="80" fill="#c9463d" font-size="11" text-anchor="middle" font-weight="bold">Not Importable</text>
  <text x="378" y="102" fill="#ccc" font-size="10">Screenshots</text>
  <text x="378" y="120" fill="#ccc" font-size="10">Video frames</text>
  <text x="378" y="138" fill="#c9463d" font-size="9">text only, no design</text>

  <path d="M105,154 L105,190 L330,190" stroke="#6abe30" stroke-width="1.5" fill="none"/>
  <path d="M271,154 L271,190" stroke="#d7b940" stroke-width="1.5" fill="none"/>
  <path d="M437,154 L437,190 L330,190" stroke="#c9463d" stroke-width="1.5" fill="none" stroke-dasharray="3,2"/>
  <polygon points="322,185 312,190 322,195" fill="#6abe30"/>

  <rect x="230" y="204" width="200" height="52" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="330" y="226" fill="#8fd4f0" font-size="12" text-anchor="middle">Ctrl+V to import</text>
  <text x="330" y="245" fill="#888" font-size="10" text-anchor="middle">blueprint tool (G) active</text>

  <text x="330" y="282" fill="#e8941c" font-size="10" text-anchor="middle">Strings encode modules, circuits, and settings - not just buildings</text>
</svg>
