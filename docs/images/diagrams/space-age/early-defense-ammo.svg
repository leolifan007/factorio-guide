<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Early Defense Ammo Supply Chain - Factorio Guide</title>
  <text x="340" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Ammo Supply: The Part That Saves Your Base</text>

  <rect x="30" y="60" width="120" height="52" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="90" y="82" fill="#8fd4f0" font-size="11" text-anchor="middle">Iron Plate</text>
  <text x="90" y="99" fill="#888" font-size="9" text-anchor="middle">belt from smelting</text>

  <line x1="150" y1="86" x2="196" y2="86" stroke="#6abe30" stroke-width="2"/>
  <polygon points="196,81 206,86 196,91" fill="#6abe30"/>

  <rect x="210" y="60" width="130" height="52" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="275" y="82" fill="#d7b940" font-size="11" text-anchor="middle">Ammo Assembler</text>
  <text x="275" y="99" fill="#888" font-size="9" text-anchor="middle">firearm magazine</text>

  <line x1="340" y1="86" x2="386" y2="86" stroke="#6abe30" stroke-width="2"/>
  <polygon points="386,81 396,86 386,91" fill="#6abe30"/>

  <rect x="400" y="60" width="120" height="52" rx="4" fill="#252525" stroke="#ce8b2e" stroke-width="2"/>
  <text x="460" y="82" fill="#ce8b2e" font-size="11" text-anchor="middle">Ammo Belt</text>
  <text x="460" y="99" fill="#888" font-size="9" text-anchor="middle">runs perimeter</text>

  <path d="M460,112 L460,140 L180,140" stroke="#ce8b2e" stroke-width="1.5" fill="none"/>
  <polygon points="180,135 170,140 180,145" fill="#ce8b2e"/>

  <g fill="#252525" stroke="#d7b940" stroke-width="1.5">
    <rect x="90" y="154" width="40" height="30" rx="3"/>
    <rect x="230" y="154" width="40" height="30" rx="3"/>
    <rect x="370" y="154" width="40" height="30" rx="3"/>
    <rect x="510" y="154" width="40" height="30" rx="3"/>
  </g>
  <text x="110" y="173" fill="#888" font-size="8" text-anchor="middle">chest</text>
  <text x="250" y="173" fill="#888" font-size="8" text-anchor="middle">chest</text>
  <text x="390" y="173" fill="#888" font-size="8" text-anchor="middle">chest</text>
  <text x="530" y="173" fill="#888" font-size="8" text-anchor="middle">chest</text>

  <g fill="#252525" stroke="#c9463d" stroke-width="1.5">
    <rect x="90" y="200" width="40" height="30" rx="3"/>
    <rect x="230" y="200" width="40" height="30" rx="3"/>
    <rect x="370" y="200" width="40" height="30" rx="3"/>
    <rect x="510" y="200" width="40" height="30" rx="3"/>
  </g>
  <text x="110" y="219" fill="#ccc" font-size="8" text-anchor="middle">turret</text>
  <text x="250" y="219" fill="#ccc" font-size="8" text-anchor="middle">turret</text>
  <text x="390" y="219" fill="#ccc" font-size="8" text-anchor="middle">turret</text>
  <text x="530" y="219" fill="#ccc" font-size="8" text-anchor="middle">turret</text>

  <text x="340" y="262" fill="#c9463d" font-size="11" text-anchor="middle" font-weight="bold">Turrets with no ammo are decoration</text>
  <text x="340" y="284" fill="#888" font-size="10" text-anchor="middle">Build this line before the first attack wave, not after</text>
</svg>
