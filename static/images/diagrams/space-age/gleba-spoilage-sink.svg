<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Gleba Spoilage Sink - Clear Jammed Belts - Factorio Guide</title>
  <text x="320" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Gleba Spoilage Sink: Stop the Jam Loop</text>

  <rect x="30" y="62" width="120" height="54" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="90" y="84" fill="#ccc" font-size="12" text-anchor="middle">Jammed Belt</text>
  <text x="90" y="100" fill="#c9463d" font-size="10" text-anchor="middle">spoilage mixed in</text>

  <line x1="150" y1="89" x2="200" y2="89" stroke="#888" stroke-width="2"/>
  <polygon points="200,84 210,89 200,94" fill="#888"/>

  <rect x="214" y="62" width="120" height="54" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="274" y="84" fill="#d7b940" font-size="11" text-anchor="middle">Filter Splitter</text>
  <text x="274" y="100" fill="#ccc" font-size="10" text-anchor="middle">filter = spoilage</text>

  <line x1="334" y1="89" x2="386" y2="89" stroke="#6abe30" stroke-width="2"/>
  <polygon points="386,84 396,89 386,94" fill="#6abe30"/>
  <rect x="400" y="62" width="120" height="54" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="460" y="84" fill="#6abe30" font-size="11" text-anchor="middle">Clean Line</text>
  <text x="460" y="100" fill="#ccc" font-size="10" text-anchor="middle">fruit keeps moving</text>

  <path d="M274,116 L274,158" stroke="#c9463d" stroke-width="1.5" fill="none"/>
  <polygon points="269,158 274,168 279,158" fill="#c9463d"/>
  <text x="320" y="145" fill="#c9463d" font-size="9" text-anchor="middle">spoilage only</text>

  <rect x="196" y="172" width="156" height="54" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="274" y="194" fill="#c9463d" font-size="11" text-anchor="middle">Recycler</text>
  <text x="274" y="210" fill="#ccc" font-size="10" text-anchor="middle">VOID - 1 per 0.5s</text>

  <rect x="400" y="172" width="150" height="54" rx="4" fill="#252525" stroke="#e8941c" stroke-width="2"/>
  <text x="475" y="194" fill="#e8941c" font-size="11" text-anchor="middle">Heating Tower</text>
  <text x="475" y="210" fill="#ccc" font-size="10" text-anchor="middle">backup sink + heat</text>

  <text x="320" y="258" fill="#e8941c" font-size="11" text-anchor="middle" font-weight="bold">Never cut nutrients to stop spoilage - it makes it worse</text>

  <rect x="60" y="274" width="520" height="48" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="80" y="294" fill="#888" font-size="10">Circuit rule: run sink when spoilage &gt; 100 (not 5000)</text>
  <text x="80" y="311" fill="#888" font-size="10">Short belts, no buffer chests - buffers are spoilage factories</text>
  <rect x="60" y="274" width="6" height="48" rx="3" fill="#c9463d"/>
</svg>
