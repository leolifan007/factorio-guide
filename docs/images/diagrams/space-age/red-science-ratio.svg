<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Red Science Ratio - Gears to Science Assemblers - Factorio Guide</title>
  <text x="320" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Red Science Ratio: 1 Gear Assembler feeds 2 Science</text>

  <rect x="40" y="60" width="130" height="58" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="105" y="84" fill="#8fd4f0" font-size="12" text-anchor="middle">Iron Plate</text>
  <text x="105" y="102" fill="#888" font-size="10" text-anchor="middle">belt feed</text>

  <line x1="170" y1="89" x2="222" y2="89" stroke="#6abe30" stroke-width="2"/>
  <polygon points="222,84 232,89 222,94" fill="#6abe30"/>

  <rect x="236" y="60" width="140" height="58" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="306" y="84" fill="#d7b940" font-size="12" text-anchor="middle">Gear Assembler</text>
  <text x="306" y="102" fill="#888" font-size="10" text-anchor="middle">0.5s per gear</text>

  <line x1="376" y1="89" x2="428" y2="89" stroke="#6abe30" stroke-width="2"/>
  <polygon points="428,84 438,89 428,94" fill="#6abe30"/>

  <rect x="442" y="60" width="150" height="58" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="517" y="84" fill="#6abe30" font-size="12" text-anchor="middle">Science Assemblers</text>
  <text x="517" y="102" fill="#888" font-size="10" text-anchor="middle">1s per pack</text>

  <text x="320" y="158" fill="#e8941c" font-size="12" text-anchor="middle" font-weight="bold">SPM targets and assembler counts</text>

  <rect x="70" y="172" width="500" height="112" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="95" y="196" fill="#888" font-size="11">SPM target</text>
  <text x="235" y="196" fill="#888" font-size="11">Gear assemblers</text>
  <text x="400" y="196" fill="#888" font-size="11">Science assemblers</text>
  <line x1="85" y1="206" x2="555" y2="206" stroke="#333" stroke-width="1"/>

  <text x="95" y="226" fill="#ccc" font-size="12">5 SPM</text>
  <text x="235" y="226" fill="#d7b940" font-size="12">3</text>
  <text x="400" y="226" fill="#6abe30" font-size="12">5</text>

  <text x="95" y="248" fill="#ccc" font-size="12">10 SPM</text>
  <text x="235" y="248" fill="#d7b940" font-size="12">5 (use 7 to be safe)</text>
  <text x="400" y="248" fill="#6abe30" font-size="12">10</text>

  <text x="95" y="270" fill="#ccc" font-size="12">20 SPM</text>
  <text x="235" y="270" fill="#d7b940" font-size="12">10 (use 14)</text>
  <text x="400" y="270" fill="#6abe30" font-size="12">20</text>

  <text x="320" y="306" fill="#c9463d" font-size="11" text-anchor="middle">Round gear assemblers UP - a starved gear line stalls all science</text>
</svg>
