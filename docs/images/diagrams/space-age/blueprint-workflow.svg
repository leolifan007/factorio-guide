<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Blueprint Workflow - Copy Save Paste - Factorio Guide</title>
  <text x="330" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Blueprint Workflow: Copy, Save, Paste</text>

  <rect x="40" y="60" width="160" height="76" rx="4" fill="#252525" stroke="#8fd4f0" stroke-width="2"/>
  <text x="120" y="84" fill="#8fd4f0" font-size="13" text-anchor="middle" font-weight="bold">1. COPY</text>
  <text x="120" y="106" fill="#ccc" font-size="11" text-anchor="middle">Press G</text>
  <text x="120" y="124" fill="#888" font-size="10" text-anchor="middle">drag a box over build</text>

  <line x1="200" y1="98" x2="248" y2="98" stroke="#6abe30" stroke-width="2"/>
  <polygon points="248,93 258,98 248,103" fill="#6abe30"/>

  <rect x="266" y="60" width="160" height="76" rx="4" fill="#252525" stroke="#d7b940" stroke-width="2"/>
  <text x="346" y="84" fill="#d7b940" font-size="13" text-anchor="middle" font-weight="bold">2. SAVE</text>
  <text x="346" y="106" fill="#ccc" font-size="11" text-anchor="middle">into a book</text>
  <text x="346" y="124" fill="#888" font-size="10" text-anchor="middle">name it [Category] X</text>

  <line x1="426" y1="98" x2="474" y2="98" stroke="#6abe30" stroke-width="2"/>
  <polygon points="474,93 484,98 474,103" fill="#6abe30"/>

  <rect x="492" y="60" width="140" height="76" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="562" y="84" fill="#6abe30" font-size="13" text-anchor="middle" font-weight="bold">3. PASTE</text>
  <text x="562" y="106" fill="#ccc" font-size="11" text-anchor="middle">click to place</text>
  <text x="562" y="124" fill="#888" font-size="10" text-anchor="middle">Ctrl+V to import</text>

  <text x="330" y="172" fill="#e8941c" font-size="12" text-anchor="middle" font-weight="bold">Shortcuts worth memorising</text>

  <rect x="50" y="188" width="270" height="120" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="70" y="210" fill="#8fd4f0" font-size="11">R</text>
  <text x="140" y="210" fill="#ccc" font-size="11">rotate held blueprint</text>
  <text x="70" y="234" fill="#8fd4f0" font-size="11">Shift+scroll</text>
  <text x="140" y="234" fill="#ccc" font-size="11">mirror blueprint</text>
  <text x="70" y="258" fill="#8fd4f0" font-size="11">Shift+click</text>
  <text x="140" y="258" fill="#ccc" font-size="11">place without tiles</text>
  <text x="70" y="282" fill="#8fd4f0" font-size="11">Ctrl+V</text>
  <text x="140" y="282" fill="#ccc" font-size="11">import a string</text>
  <text x="70" y="302" fill="#8fd4f0" font-size="11">Q</text>
  <text x="140" y="302" fill="#ccc" font-size="11">clear cursor</text>

  <rect x="340" y="188" width="270" height="120" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="360" y="210" fill="#d7b940" font-size="11" font-weight="bold">Import / Export</text>
  <text x="360" y="234" fill="#ccc" font-size="10">Import: Ctrl+V with tool active</text>
  <text x="360" y="254" fill="#ccc" font-size="10">Export: select &gt; Export button</text>
  <text x="360" y="274" fill="#ccc" font-size="10">         then Ctrl+C to copy</text>
  <text x="360" y="298" fill="#c9463d" font-size="10">Screenshots are NOT strings</text>
  <rect x="340" y="188" width="6" height="120" rx="3" fill="#d7b940"/>
</svg>
