<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Aquilo Landing Manifest Checklist - Factorio Guide</title>
  <text x="320" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Aquilo Landing Manifest</text>

  <rect x="30" y="55" width="180" height="120" rx="4" fill="#252525" stroke="#c9463d" stroke-width="2"/>
  <text x="120" y="78" fill="#c9463d" font-size="13" text-anchor="middle" font-weight="bold">HEAT (critical)</text>
  <text x="46" y="102" fill="#ccc" font-size="11">Heating towers x 4-6</text>
  <text x="46" y="122" fill="#ccc" font-size="11">Heat pipes x 200+</text>
  <text x="46" y="142" fill="#ccc" font-size="11">Rocket fuel x 2000+</text>
  <text x="46" y="162" fill="#e8941c" font-size="10">No fuel = total freeze</text>

  <rect x="230" y="55" width="180" height="120" rx="4" fill="#252525" stroke="#4a90d9" stroke-width="2"/>
  <text x="320" y="78" fill="#4a90d9" font-size="13" text-anchor="middle" font-weight="bold">DEFENSE</text>
  <text x="246" y="102" fill="#ccc" font-size="11">Rocket turrets x 10-15</text>
  <text x="246" y="122" fill="#ccc" font-size="11">Rocket ammo x 1000+</text>
  <text x="246" y="142" fill="#ccc" font-size="11">Laser turrets x 10-20</text>
  <text x="246" y="162" fill="#8fd4f0" font-size="10">vs strafers only</text>

  <rect x="430" y="55" width="180" height="120" rx="4" fill="#252525" stroke="#6abe30" stroke-width="2"/>
  <text x="520" y="78" fill="#6abe30" font-size="13" text-anchor="middle" font-weight="bold">BUILD</text>
  <text x="446" y="102" fill="#ccc" font-size="11">Ice platforms x 200+</text>
  <text x="446" y="122" fill="#ccc" font-size="11">Concrete x 500+</text>
  <text x="446" y="142" fill="#ccc" font-size="11">Assemblers x 20+</text>
  <text x="446" y="162" fill="#6abe30" font-size="10">Nothing builds on snow</text>

  <text x="320" y="205" fill="#e8941c" font-size="12" text-anchor="middle" font-weight="bold">The 3 items that end runs</text>

  <rect x="40" y="220" width="180" height="62" rx="4" fill="#1a1a1a" stroke="#c9463d" stroke-width="1.5"/>
  <text x="130" y="242" fill="#c9463d" font-size="11" text-anchor="middle">1. Heat pipes</text>
  <text x="130" y="260" fill="#888" font-size="9" text-anchor="middle">towers cannot connect</text>
  <text x="130" y="274" fill="#888" font-size="9" text-anchor="middle">without them</text>

  <rect x="230" y="220" width="180" height="62" rx="4" fill="#1a1a1a" stroke="#c9463d" stroke-width="1.5"/>
  <text x="320" y="242" fill="#c9463d" font-size="11" text-anchor="middle">2. Tile for every spot</text>
  <text x="320" y="260" fill="#888" font-size="9" text-anchor="middle">even belts and poles</text>
  <text x="320" y="274" fill="#888" font-size="9" text-anchor="middle">need platform</text>

  <rect x="420" y="220" width="180" height="62" rx="4" fill="#1a1a1a" stroke="#c9463d" stroke-width="1.5"/>
  <text x="510" y="242" fill="#c9463d" font-size="11" text-anchor="middle">3. Spare towers</text>
  <text x="510" y="260" fill="#888" font-size="9" text-anchor="middle">one freeze cascades</text>
  <text x="510" y="274" fill="#888" font-size="9" text-anchor="middle">to whole base</text>

  <rect x="60" y="300" width="520" height="52" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <text x="80" y="320" fill="#888" font-size="10">No local stone, copper, iron, coal, oil, or water - all imported</text>
  <text x="80" y="338" fill="#888" font-size="10">Do not launch with under 1000 rocket fuel: you cannot fix a freeze remotely</text>
  <rect x="60" y="300" width="6" height="52" rx="3" fill="#e8941c"/>
</svg>
