<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Space Platform Weight Budget - Foundation Tiles Are What Slows You Down - Factorio Guide</title>
  <text x="320" y="26" fill="#4a90d9" font-size="16" text-anchor="middle" font-weight="bold">Why Your Ship Crawls: Weight Is Counted Per Foundation Tile</text>

  <rect x="40" y="48" width="200" height="150" rx="5" fill="#1a1a1a" stroke="#6abe30" stroke-width="2"/>
  <text x="140" y="70" fill="#6abe30" font-size="12" text-anchor="middle" font-weight="bold">LIGHT SHIP</text>
  <text x="56" y="94" fill="#ccc" font-size="10">Space platform hub</text>
  <text x="212" y="94" fill="#6abe30" font-size="10">20 t</text>
  <text x="56" y="112" fill="#ccc" font-size="10">200 foundation tiles</text>
  <text x="212" y="112" fill="#d7b940" font-size="10">40 t</text>
  <text x="56" y="130" fill="#ccc" font-size="10">Cargo bays</text>
  <text x="212" y="130" fill="#6abe30" font-size="10">0 t extra</text>
  <text x="56" y="148" fill="#ccc" font-size="10">Total</text>
  <text x="212" y="148" fill="#6abe30" font-size="10" font-weight="bold">60 t</text>
  <text x="56" y="172" fill="#6abe30" font-size="10" font-weight="bold">Result: high speed</text>
  <text x="56" y="188" fill="#999" font-size="9">fewer thruster ticks needed</text>

  <rect x="400" y="48" width="200" height="150" rx="5" fill="#1a1a1a" stroke="#c9463d" stroke-width="2"/>
  <text x="500" y="70" fill="#c9463d" font-size="12" text-anchor="middle" font-weight="bold">HEAVY SHIP</text>
  <text x="416" y="94" fill="#ccc" font-size="10">Space platform hub</text>
  <text x="572" y="94" fill="#c9463d" font-size="10">20 t</text>
  <text x="416" y="112" fill="#ccc" font-size="10">2000 foundation tiles</text>
  <text x="572" y="112" fill="#d7b940" font-size="10">400 t</text>
  <text x="416" y="130" fill="#ccc" font-size="10">Cargo bays</text>
  <text x="572" y="130" fill="#6abe30" font-size="10">0 t extra</text>
  <text x="416" y="148" fill="#ccc" font-size="10">Total</text>
  <text x="572" y="148" fill="#c9463d" font-size="10" font-weight="bold">420 t</text>
  <text x="416" y="172" fill="#c9463d" font-size="10" font-weight="bold">Result: crawl or stall</text>
  <text x="416" y="188" fill="#999" font-size="9">thrusters burn fuel for nothing</text>

  <rect x="250" y="86" width="140" height="74" rx="4" fill="#231a10" stroke="#e8941c" stroke-width="1"/>
  <text x="320" y="106" fill="#e8941c" font-size="10" text-anchor="middle" font-weight="bold">1 tile = 200 kg</text>
  <text x="320" y="122" fill="#999" font-size="9" text-anchor="middle">0.2 tons each</text>
  <text x="320" y="138" fill="#999" font-size="9" text-anchor="middle">cargo bays are free,</text>
  <text x="320" y="152" fill="#999" font-size="9" text-anchor="middle">the deck is not</text>

  <rect x="40" y="218" width="560" height="96" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
  <rect x="40" y="218" width="6" height="96" rx="3" fill="#e8941c"/>
  <text x="60" y="240" fill="#e8941c" font-size="11" font-weight="bold">What players get wrong</text>
  <text x="60" y="258" fill="#999" font-size="10">Adding cargo bays does NOT add weight. Adding the floor under them does.</text>
  <text x="60" y="276" fill="#999" font-size="10">More thrusters = more speed, but asteroids also arrive faster and hit harder.</text>
  <text x="60" y="294" fill="#999" font-size="10">Thrusters stopped mid-route: the ship drifts toward whichever planet it is closer to.</text>
  <text x="60" y="310" fill="#999" font-size="10">Trim unused foundation before you add thruster number eleven.</text>
</svg>
