<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Red Science Belt Layout - Iron Feed to Labs - Factorio Guide</title>
  <text x="340" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Red Science Layout That Never Stalls</text>

  <rect x="40" y="52" width="600" height="34" rx="4" fill="#3a2a12" stroke="#d7b940" stroke-width="1.5"/>
  <text x="52" y="74" fill="#d7b940" font-size="11">IRON PLATE BELT  -&gt;</text>

  <rect x="40" y="112" width="600" height="34" rx="4" fill="#2a2412" stroke="#ce8b2e" stroke-width="1.5"/>
  <text x="52" y="134" fill="#ce8b2e" font-size="11">COPPER PLATE BELT  -&gt;</text>

  <g>
    <rect x="80" y="170" width="90" height="52" rx="4" fill="#252525" stroke="#d7b940" stroke-width="1.5"/>
    <text x="125" y="192" fill="#d7b940" font-size="10" text-anchor="middle">Gear</text>
    <text x="125" y="207" fill="#888" font-size="9" text-anchor="middle">assembler</text>
  </g>
  <g>
    <rect x="190" y="170" width="90" height="52" rx="4" fill="#252525" stroke="#d7b940" stroke-width="1.5"/>
    <text x="235" y="192" fill="#d7b940" font-size="10" text-anchor="middle">Gear</text>
    <text x="235" y="207" fill="#888" font-size="9" text-anchor="middle">assembler</text>
  </g>
  <g>
    <rect x="300" y="170" width="90" height="52" rx="4" fill="#252525" stroke="#6abe30" stroke-width="1.5"/>
    <text x="345" y="192" fill="#6abe30" font-size="10" text-anchor="middle">Science</text>
    <text x="345" y="207" fill="#888" font-size="9" text-anchor="middle">assembler</text>
  </g>
  <g>
    <rect x="410" y="170" width="90" height="52" rx="4" fill="#252525" stroke="#6abe30" stroke-width="1.5"/>
    <text x="455" y="192" fill="#6abe30" font-size="10" text-anchor="middle">Science</text>
    <text x="455" y="207" fill="#888" font-size="9" text-anchor="middle">assembler</text>
  </g>

  <path d="M125,222 L125,240 L560,240 L560,222" stroke="#6abe30" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <rect x="500" y="170" width="90" height="52" rx="4" fill="#252525" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="545" y="192" fill="#4a90d9" font-size="10" text-anchor="middle">Labs</text>
  <text x="545" y="207" fill="#888" font-size="9" text-anchor="middle">research</text>
  <path d="M500,196 L475,196" stroke="#6abe30" stroke-width="1.5" fill="none"/>
  <polygon points="475,191 467,196 475,201" fill="#6abe30"/>

  <text x="340" y="268" fill="#e8941c" font-size="11" text-anchor="middle" font-weight="bold">Build order</text>
  <text x="90" y="292" fill="#888" font-size="10">1. Iron belt runs down the back</text>
  <text x="90" y="310" fill="#888" font-size="10">2. Gears feed first, then science</text>
  <text x="90" y="328" fill="#888" font-size="10">3. Copper enters from the side</text>
  <text x="380" y="292" fill="#888" font-size="10">4. Science belt runs to labs</text>
  <text x="380" y="310" fill="#888" font-size="10">5. Check every lab has power + inserter</text>
  <text x="380" y="328" fill="#c9463d" font-size="10">Stalled gears = stalled science</text>
</svg>
