<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" style="background:#111;font-family:system-ui,sans-serif;">
  <title>Early Game Defense Layers - Factorio Guide</title>
  <text x="340" y="28" fill="#e8941c" font-size="16" text-anchor="middle" font-weight="bold">Early Defense: Wall + Turrets + Ammo</text>

  <line x1="60" y1="80" x2="620" y2="80" stroke="#a06a3a" stroke-width="6" stroke-dasharray="10,4"/>
  <text x="340" y="72" fill="#a06a3a" font-size="10" text-anchor="middle">1-tile stone wall</text>

  <g fill="#252525" stroke="#c9463d" stroke-width="2">
    <rect x="90" y="96" width="34" height="34" rx="3"/>
    <rect x="210" y="96" width="34" height="34" rx="3"/>
    <rect x="330" y="96" width="34" height="34" rx="3"/>
    <rect x="450" y="96" width="34" height="34" rx="3"/>
    <rect x="570" y="96" width="34" height="34" rx="3"/>
  </g>
  <text x="107" y="117" fill="#ccc" font-size="9" text-anchor="middle">turret</text>
  <text x="227" y="117" fill="#ccc" font-size="9" text-anchor="middle">turret</text>
  <text x="347" y="117" fill="#ccc" font-size="9" text-anchor="middle">turret</text>
  <text x="467" y="117" fill="#ccc" font-size="9" text-anchor="middle">turret</text>
  <text x="587" y="117" fill="#ccc" font-size="9" text-anchor="middle">turret</text>

  <path d="M124,113 L206,113" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="165" y="108" fill="#888" font-size="9" text-anchor="middle">5-8 tiles</text>

  <g fill="#252525" stroke="#d7b940" stroke-width="1.5">
    <rect x="96" y="146" width="22" height="22" rx="3"/>
    <rect x="216" y="146" width="22" height="22" rx="3"/>
    <rect x="336" y="146" width="22" height="22" rx="3"/>
    <rect x="456" y="146" width="22" height="22" rx="3"/>
    <rect x="576" y="146" width="22" height="22" rx="3"/>
  </g>
  <text x="340" y="188" fill="#d7b940" font-size="10" text-anchor="middle">steel chest + inserter per turret</text>

  <rect x="40" y="202" width="600" height="26" rx="3" fill="#2a2412" stroke="#ce8b2e" stroke-width="1.5"/>
  <text x="52" y="220" fill="#ce8b2e" font-size="10">DEDICATED AMMO BELT  -&gt;   firearm magazines / piercing rounds</text>

  <rect x="40" y="244" width="288" height="60" rx="4" fill="#1a1a1a" stroke="#c9463d" stroke-width="1"/>
  <text x="60" y="264" fill="#c9463d" font-size="10">No ammo = decoration</text>
  <text x="60" y="282" fill="#888" font-size="9">Build the ammo line BEFORE the first wave</text>
  <text x="60" y="297" fill="#888" font-size="9">One assembler feeds a whole perimeter</text>

  <rect x="352" y="244" width="288" height="60" rx="4" fill="#1a1a1a" stroke="#6abe30" stroke-width="1"/>
  <text x="372" y="264" fill="#6abe30" font-size="10">Cut pollution instead</text>
  <text x="372" y="282" fill="#888" font-size="9">Efficiency module 1 in miners = -30%</text>
  <text x="372" y="297" fill="#888" font-size="9">Cheaper than doubling your turrets</text>
</svg>
